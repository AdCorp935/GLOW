name: Déployer sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Force le rechargement de la feuille de style et du script à chaque
      # déploiement, pour qu'un visiteur ne garde pas une ancienne version en cache.
      - name: Versionner les feuilles de style et les scripts
        run: |
          VER="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty sed -i -E \
                "s@(href=\"[^\"]*\.css)\"@\1?v=$VER\"@g; s@(src=\"[^\"]*\.js)\"@\1?v=$VER\"@g"

      - name: Uploader l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
